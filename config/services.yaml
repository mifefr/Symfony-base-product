services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Domain/Exception/'
            - '../src/Domain/Model/'
            - '../src/Domain/ValueObject/'
            - '../src/Infrastructure/Doctrine/Type/'
            - '../src/Infrastructure/Request/'
            - '../src/Kernel.php'

    App\Infrastructure\Adapter\StripeAdapter:
        arguments:
            $apiKey: '%env(STRIPE_SECRET_KEY)%'
